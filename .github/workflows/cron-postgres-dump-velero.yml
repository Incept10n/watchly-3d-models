name: Velero PostgreSQL Backup

on:
  schedule:
    # Runs at 2:00 AM UTC every day
    #- cron: "0 2 * * *"
    - cron: "*/5 * * * *" # added for test
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  velero-backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Install Velero CLI
        run: |
          wget https://github.com/vmware-tanzu/velero/releases/latest/download/velero-linux-amd64.tar.gz
          tar -xvf velero-linux-amd64.tar.gz
          sudo mv velero /usr/local/bin/
          velero version
      
      - name: Get kubectl binary and setup kubeconfig
        uses: tale/kubectl-action@v1
        with:
          base64-kube-config: ${{ secrets.KUBE_CONFIG }}
      
      - name: Create Velero Backup
        run: |
          BACKUP_NAME="postgresql-backup-$(date +%Y%m%d-%H%M%S)"
          echo "Starting backup: $BACKUP_NAME"
          
          velero backup create "$BACKUP_NAME" \
            --include-namespaces watchly-3d-models \
            --default-volumes-to-fs-backup \
            --wait
          
          if [ $? -eq 0 ]; then
            echo "Backup $BACKUP_NAME completed successfully"
            echo "BACKUP_NAME=$BACKUP_NAME" >> $GITHUB_ENV
          else
            echo "Backup failed!"
            exit 1
          fi
      
      - name: Verify Backup Status
        run: |
          velero backup describe "${{ env.BACKUP_NAME }}"
          velero backup logs "${{ env.BACKUP_NAME }}"
      
      - name: Cleanup Old Backups (Optional)
        run: |
          # Keep only last 7 daily backups
          velero backup delete --confirm --older-than 168h