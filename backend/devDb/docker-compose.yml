version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: watch-builder-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    network_mode: host

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
