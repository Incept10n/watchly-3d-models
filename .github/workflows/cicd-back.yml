name: ci-cd for back

on:
  push:
    branches: [ master ]
    paths:
        - 'backend/**'
  workflow_dispatch:

jobs:
  build-and-push-back:
    name: Push back Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: incept1on/watchly-3d-models

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: incept1on/watchly-3d-models:back
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  migrate-database:
    name: Run migrations
    runs-on: ubuntu-latest
    needs: build-and-push-back
    steps:
      - name: Get kubectl binary
        uses: tale/kubectl-action@v1
        with:
          base64-kube-config: ${{ secrets.KUBE_CONFIG }}

      - name: Run database migrations
        run: |
          kubectl run db-migration --image=incept1on/watchly-3d-models:back --restart=Never --rm --attach --quiet --command -- sh -c "npx prisma migrate deploy" -n watchly-3d-models --overrides='{"spec":{"containers":[{"env":[{"name":"WH_DATABASE_URL","valueFrom":{"secretKeyRef":{"name":"watchly-3d-models-secret","key":"WH_DATABASE_URL"}}}]}]}}'

      - name: Migrations completed
        run: |
          echo "Migrations completed successfully!"

  deploy-back-prod:
    name: Update k8s back image
    runs-on: ubuntu-latest
    needs: migrate-database
    steps:
      - name: Get kubectl binary
        uses: tale/kubectl-action@v1
        with:
          base64-kube-config: ${{ secrets.KUBE_CONFIG }}

      - name: Restart backend deployment via k
        run: |
          kubectl rollout restart deployment backend -n watchly-3d-models 

      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment backend -n watchly-3d-models --timeout=5m 
