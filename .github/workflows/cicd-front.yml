name: ci-cd for front

on:
  push:
    branches: [ master ]
    paths:
        - 'frontend/**'
  workflow_dispatch:

jobs:
  build-and-push-front:
    name: Push front Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: incept1on/watchly-3d-models

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: incept1on/watchly-3d-models:front
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            VITE_BASE_URL=${{ secrets.VITE_BASE_URL }}

  deploy-back-prod:
    name: Update ArgoCD and restart backend
    runs-on: ubuntu-latest
    needs: build-and-push-front
    steps:
      - name: Restart backend deployment via k
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: rollout restart deployment watchly-3d-models-front -n watchly-3d-models

      - name: Wait for rollout to complete
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: rollout status deployment watchly-3d-models-front -n watchly-3d-models --timeout=5m
